name: cause_explorer
description: "Production-quality Flutter application demonstrating Clean Architecture and Riverpod state management for internship portfolio."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Navigation
  go_router: ^14.2.0

  # Image Caching & UI
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

#assets
assets:
  - assets/screenshots/
